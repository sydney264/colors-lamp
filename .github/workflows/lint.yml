name: Lint Code

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'


      - name: Install dependencies
        run: npm install

      - name: Fix npm permissions
        run: chmod +x node_modules/.bin/eslint
        

      - name: Run lint
        run: npm run lint:js